appId: com.openperfboard.app
productName: Open Perfboard
directories:
  output: dist
files:
  - out/**
  - build/icon.png # 창 아이콘 (main/index.ts)
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
fileAssociations:
  - ext: opb
    name: Open Perfboard Project
    description: Open Perfboard 배선도
    mimeType: application/x-open-perfboard # Linux 파일 연결에 필요
linux:
  target: [AppImage, deb, rpm]
  category: Engineering
  icon: build/icons
  executableName: open-perfboard # 공백 없는 실행 파일 이름 (Windows는 productName 그대로)
  synopsis: Offline wire harness diagram editor
  artifactName: ${name}-${version}-${arch}.${ext}
