<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <!-- 제어 보드 CTRL-32 (README 예시용으로 직접 그림). 헤더 J1은 위쪽 -->
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7a4d"/><stop offset="1" stop-color="#155c3a"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#14171c"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="388" height="248" rx="16" fill="url(#pcb)" stroke="#0f3f28" stroke-width="3"/>
  <circle cx="22" cy="100" r="8" fill="#e8e1c8"/><circle cx="378" cy="100" r="8" fill="#e8e1c8"/>
  <circle cx="26" cy="234" r="8" fill="#e8e1c8"/><circle cx="374" cy="234" r="8" fill="#e8e1c8"/>
  <!-- 헤더 J1 -->
  <rect x="40" y="8" width="320" height="34" rx="4" fill="#111827"/>
  <g fill="#e2b34a" stroke="#8a6a1f" stroke-width="2">
    <circle cx="60" cy="25" r="8"/><circle cx="100" cy="25" r="8"/><circle cx="140" cy="25" r="8"/><circle cx="180" cy="25" r="8"/>
    <circle cx="220" cy="25" r="8"/><circle cx="260" cy="25" r="8"/><circle cx="300" cy="25" r="8"/><circle cx="340" cy="25" r="8"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12" fill="#ecfdf5" text-anchor="middle">
    <text x="60" y="60">5V</text><text x="100" y="60">GND</text><text x="140" y="60">IO4</text><text x="180" y="60">IO5</text>
    <text x="220" y="60">IO12</text><text x="260" y="60">IO13</text><text x="300" y="60">IO14</text><text x="340" y="60">IO15</text>
  </g>
  <!-- USB -->
  <rect x="0" y="160" width="44" height="46" rx="4" fill="#c9ced6" stroke="#8a929e" stroke-width="2"/>
  <rect x="8" y="172" width="24" height="22" rx="2" fill="#6b7280"/>
  <!-- 칩 -->
  <rect x="150" y="100" width="120" height="110" rx="6" fill="url(#chip)"/>
  <text x="210" y="152" font-family="Consolas, monospace" font-size="18" fill="#cfd4dc" text-anchor="middle">CTRL-32</text>
  <text x="210" y="174" font-family="Consolas, monospace" font-size="11" fill="#8b929c" text-anchor="middle">DEMO MCU</text>
  <g fill="#c7cbd1">
    <rect x="160" y="92" width="6" height="8"/><rect x="176" y="92" width="6" height="8"/><rect x="192" y="92" width="6" height="8"/><rect x="208" y="92" width="6" height="8"/><rect x="224" y="92" width="6" height="8"/><rect x="240" y="92" width="6" height="8"/><rect x="256" y="92" width="6" height="8"/>
    <rect x="160" y="210" width="6" height="8"/><rect x="176" y="210" width="6" height="8"/><rect x="192" y="210" width="6" height="8"/><rect x="208" y="210" width="6" height="8"/><rect x="224" y="210" width="6" height="8"/><rect x="240" y="210" width="6" height="8"/><rect x="256" y="210" width="6" height="8"/>
  </g>
  <!-- LED, 버튼 -->
  <rect x="310" y="120" width="14" height="9" rx="2" fill="#f59e0b"/><rect x="310" y="140" width="14" height="9" rx="2" fill="#22c55e"/>
  <rect x="80" y="116" width="34" height="26" rx="4" fill="#d1d5db"/><circle cx="97" cy="129" r="8" fill="#374151"/>
</svg>
