<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8a57"/>
      <stop offset="1" stop-color="#1a5c38"/>
    </linearGradient>
    <g id="pad">
      <circle r="21" fill="#e0a84a"/>
      <circle r="21" fill="none" stroke="#a8742a" stroke-width="3"/>
      <circle r="8" fill="#123f27"/>
    </g>
  </defs>

  <!-- 기판 -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#board)"/>
  <rect x="40" y="40" width="432" height="432" rx="82" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- 패드 5x5 -->
  <g>
    <use href="#pad" x="116" y="116"/><use href="#pad" x="186" y="116"/><use href="#pad" x="256" y="116"/><use href="#pad" x="326" y="116"/><use href="#pad" x="396" y="116"/>
    <use href="#pad" x="116" y="186"/><use href="#pad" x="186" y="186"/><use href="#pad" x="256" y="186"/><use href="#pad" x="326" y="186"/><use href="#pad" x="396" y="186"/>
    <use href="#pad" x="116" y="256"/><use href="#pad" x="186" y="256"/><use href="#pad" x="256" y="256"/><use href="#pad" x="326" y="256"/><use href="#pad" x="396" y="256"/>
    <use href="#pad" x="116" y="326"/><use href="#pad" x="186" y="326"/><use href="#pad" x="256" y="326"/><use href="#pad" x="326" y="326"/><use href="#pad" x="396" y="326"/>
    <use href="#pad" x="116" y="396"/><use href="#pad" x="186" y="396"/><use href="#pad" x="256" y="396"/><use href="#pad" x="326" y="396"/><use href="#pad" x="396" y="396"/>
  </g>

  <!-- 전선: 어두운 외곽선 위에 색상 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 396 V256 H326 V116" stroke="#0d2e1c" stroke-opacity="0.55" stroke-width="32"/>
    <path d="M116 396 V256 H326 V116" stroke="#e53935" stroke-width="22"/>
    <path d="M396 396 V326 H186" stroke="#0d2e1c" stroke-opacity="0.55" stroke-width="32"/>
    <path d="M396 396 V326 H186" stroke="#1e88e5" stroke-width="22"/>
  </g>

  <!-- 납땜 지점 -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="5">
    <circle cx="116" cy="396" r="18" fill="#c62828"/>
    <circle cx="326" cy="116" r="18" fill="#c62828"/>
    <circle cx="396" cy="396" r="18" fill="#1565c0"/>
    <circle cx="186" cy="326" r="18" fill="#1565c0"/>
  </g>
</svg>
